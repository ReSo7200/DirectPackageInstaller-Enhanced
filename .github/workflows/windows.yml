name: Windows build

on:
  push:
    branches: [ DN8 ]
  pull_request:
    branches: [ DN8 ]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish zips + Update.ini to the Updater branch (in-app updater)'
        type: boolean
        default: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Windows zips
        shell: pwsh
        run: ./build-windows.ps1 -Runtimes win-x64,win-x86,win-arm64

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path DirectPackageInstaller/DirectPackageInstaller/SelfUpdate.cs -Pattern 'CurrentVersion = "([^"]+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: DPI-Enhanced-${{ steps.ver.outputs.version }}-windows
          path: Release/*.zip

    outputs:
      version: ${{ steps.ver.outputs.version }}

  publish-updater:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DPI-Enhanced-${{ needs.build.outputs.version }}-windows
          path: zips

      - name: Push to Updater branch
        env:
          VER: ${{ needs.build.outputs.version }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 --branch Updater "https://x-access-token:${TOKEN}@github.com/${REPO}.git" upd \
            || { git init upd && git -C upd checkout --orphan Updater && git -C upd remote add origin "https://x-access-token:${TOKEN}@github.com/${REPO}.git"; }
          cp zips/*.zip upd/
          # Format read by SelfUpdate.cs: [DotNet] runtime check + one [OS-Arch] section per zip.
          {
            printf '[DotNet]\nVersionName=8.0\nMatch=Microsoft.NETCore.App 8.\n'
            for z in zips/*.zip; do
              printf '\n[%s]\nLastVersion=%s\n' "$(basename "$z" .zip)" "$VER"
            done
          } > upd/Update.ini
          cd upd
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update Windows builds to $VER" || { echo "nothing to publish"; exit 0; }
          git push origin Updater
